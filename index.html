<style>
:root{--ink:#252a28;--muted:#68706b;--line:#dce0da;--paper:#fff;--wash:#f4f5f1;--accent:#344d41;--soft:#eaf0e9}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:var(--wash);font:15px/1.55 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,textarea{font:inherit}button,a,input,textarea{ -webkit-tap-highlight-color:transparent}button{cursor:pointer}button{border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--ink);padding:9px 14px;font-weight:600}button:hover{background:#edf0e9;border-color:#aab6ac}button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #809a86;outline-offset:3px}button.primary{background:var(--accent);color:white;border-color:var(--accent)}button.primary:hover{background:#253c30}button.quiet{background:transparent;border-color:transparent;padding:6px 8px}button.small{font-size:13px;padding:6px 10px}button[aria-pressed=true],button[aria-selected=true]{background:var(--soft);border-color:#829789;color:#243f2b}a{color:var(--accent)}header{background:white;border-bottom:1px solid var(--line);padding:0 4%;display:flex;align-items:center;justify-content:space-between;gap:20px;min-height:78px} .brand{display:flex;gap:10px;align-items:center;font-size:21px;font-weight:750;letter-spacing:-.8px}.brandmark{background:var(--accent);color:white;display:grid;place-items:center;width:32px;height:32px;border-radius:7px;font-size:18px}header nav{display:flex;gap:7px;flex-wrap:wrap}.identity{display:flex;gap:9px;align-items:center;font-size:13px}.avatar{width:43px;height:43px;border-radius:50%;background:#e5e9e2;display:inline-grid;place-items:center;flex-shrink:0;font-weight:650;color:#435448;letter-spacing:.3px}.avatar.large{height:76px;width:76px;font-size:25px}.demo-bar{background:#edf0e9;border-bottom:1px solid var(--line);padding:7px 4%;font-size:12px;color:#546052;display:flex;justify-content:space-between;gap:12px}.shell{max-width:1400px;margin:auto;display:grid;grid-template-columns:215px minmax(0,1fr);gap:38px;padding:34px 4% 60px}.sidebar{padding-top:6px}.eyebrow{font-size:11px;letter-spacing:1.8px;text-transform:uppercase;font-weight:750;color:var(--muted);margin:0 0 14px}.sidebar button{display:block;text-align:left;width:100%;margin-bottom:7px}.sidebar .note{margin-top:30px;padding:18px 3px;border-top:1px solid var(--line)}main{min-width:0}h1,h2,h3,p{margin-top:0}h1{font-size:34px;line-height:1.18;letter-spacing:-1.1px;margin-bottom:13px}h2{font-size:20px;letter-spacing:-.4px;margin-bottom:16px}h3{font-size:17px;line-height:1.35;margin-bottom:9px}p{margin-bottom:14px}.muted{color:var(--muted)}.tiny{font-size:12px}.subtitle{color:var(--muted);max-width:660px}.pagehead{margin-bottom:28px}.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.between{justify-content:space-between}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:17px}.card,.panel{background:white;border:1px solid var(--line);border-radius:10px;padding:23px}.community-card{display:flex;flex-direction:column;align-items:flex-start;min-height:268px}.community-card p{font-size:14px;color:var(--muted)}.community-card button{margin-top:auto}.community-icon{height:40px;width:43px;display:grid;place-items:center;background:var(--soft);border:1px solid var(--line);border-radius:8px;margin-bottom:21px;font-weight:750;font-size:18px}.section{margin-top:32px}.two-col{display:grid;grid-template-columns:minmax(0,1fr) 265px;gap:22px}.stack>*+*{margin-top:16px}.tag{display:inline-block;font-size:11px;font-weight:650;background:#f0f2ed;padding:4px 8px;border-radius:4px;color:#56614f}.person-line{display:flex;align-items:center;gap:11px;margin-bottom:15px}.person-line p{margin:0}.tabs{display:flex;gap:8px;border-bottom:1px solid var(--line);padding-bottom:12px;margin:25px 0 22px}.text-link{border:0;background:none;padding:0;text-align:left;color:var(--accent);font-weight:650}.post-title{font-size:18px;margin:8px 0}.post-body{white-space:pre-wrap;overflow-wrap:anywhere}.post-footer{border-top:1px solid #edf0ea;margin-top:19px;padding-top:13px}.comments{margin-top:16px;border-top:1px solid var(--line);padding-top:18px}.comment{padding:13px;background:var(--wash);border-radius:6px;margin-bottom:12px}.comment p{margin:4px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}input,textarea{width:100%;border:1px solid #c9d0c7;border-radius:6px;background:white;color:var(--ink);padding:10px 12px}textarea{resize:vertical;min-height:94px}label{display:block;font-size:14px;font-weight:600;margin-bottom:7px}.field{margin-bottom:18px}.filters{display:flex;gap:8px;margin-bottom:20px}.people-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.profile{max-width:790px}.profile .banner{height:75px;background:#e4e9e1;border-radius:8px;margin:-23px -23px 0}.profile .avatar{margin-top:-25px;border:5px solid white}.profile h1{margin-top:12px}.profile section{border-top:1px solid var(--line);padding-top:22px;margin-top:22px}.inbox{display:grid;grid-template-columns:220px minmax(0,1fr);background:white;border:1px solid var(--line);border-radius:10px;overflow:hidden}.thread-list{border-right:1px solid var(--line);padding:16px}.thread-list button{display:block;text-align:left;width:100%;margin-top:10px;white-space:normal}.thread-list .person-line{margin:0;gap:8px}.thread-list .avatar{width:32px;height:32px;font-size:12px}.chat{min-width:0}.chat-head{padding:18px;border-bottom:1px solid var(--line)}.chat-head .person-line{margin:0}.transcript{height:420px;overflow-y:auto;overscroll-behavior:contain;padding:23px;display:flex;flex-direction:column;gap:17px;background:#fbfcf9}.bubble{max-width:88%;align-self:flex-start}.bubble.mine{align-self:flex-end}.bubble-name{font-size:11px;font-weight:650;color:var(--muted);margin:0 0 5px}.bubble-body{padding:12px 15px;border:1px solid var(--line);border-radius:0 10px 10px 10px;background:white;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px}.mine .bubble-body{background:#eaf0e7;border-color:#d9e1d5;border-radius:10px 0 10px 10px}.bubble button{margin-top:10px}.composer{padding:17px;border-top:1px solid var(--line)}.composer textarea{min-height:75px;max-height:150px}.composer .row{margin-top:10px}.reflection{max-width:760px}.rating{display:flex;gap:10px;margin:10px 0}.rating button{width:48px;height:44px}.feedback{padding:18px;border-left:3px solid #7d927c;background:#f0f3ec;margin-top:20px}.feedback p{margin-bottom:0}dialog{border:1px solid var(--line);border-radius:12px;padding:27px;max-width:560px;width:calc(100% - 32px);box-shadow:0 20px 80px #16271d30;color:var(--ink)}dialog::backdrop{background:#14201966}dialog h2{margin:0}.dialog-top{display:flex;justify-content:space-between;gap:20px;align-items:center;margin-bottom:20px}.dialog-actions{display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap;margin-top:20px}.clip{width:100%;text-align:left;margin:8px 0;display:block}.call-stage{text-align:center;background:var(--wash);padding:28px 12px;border-radius:9px;margin-top:15px}.call-stage .avatar{margin:12px}.call-controls{justify-content:center;margin-top:20px}#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#263d2e;color:white;border-radius:8px;padding:12px 19px;z-index:10;box-shadow:0 4px 25px #0002;max-width:90%;font-size:14px}#toast:empty{display:none}.back{margin-bottom:20px}fieldset{border:0;padding:0;margin:0 0 22px}legend{font-weight:600;font-size:14px}.space{height:12px}button.danger{color:#8a3535;border-color:#dabbbb}footer{margin-top:34px;font-size:12px;color:var(--muted)}
@media(min-width:1450px){.shell{padding-left:30px;padding-right:30px}}@media(max-width:1100px){.shell{grid-template-columns:175px minmax(0,1fr);gap:25px}.two-col{grid-template-columns:1fr}.two-col>aside{display:none}.cards{gap:12px}.card,.panel{padding:18px}.inbox{grid-template-columns:175px minmax(0,1fr)}.identity span:last-child{display:none}}@media(max-width:780px){header{flex-wrap:wrap;padding:16px 5%;gap:12px}header nav{order:3;width:100%}header nav button{flex:1;padding:8px;font-size:13px}.shell{display:block;padding:25px 5% 40px}.sidebar{display:none}.demo-bar{padding:7px 5%}.demo-bar span:last-child{display:none}.cards,.people-grid{grid-template-columns:1fr}.community-card{min-height:0}.community-card button{margin-top:8px}.community-icon{margin-bottom:14px}h1{font-size:29px}.inbox{grid-template-columns:1fr}.thread-list{border-right:0;border-bottom:1px solid var(--line);display:flex;gap:8px;padding:10px}.thread-list>p{display:none}.thread-list button{margin:0;width:auto;flex:1;padding:7px}.thread-list .muted{display:none}.chat-head{padding:13px}.chat-head .row{gap:6px}.transcript{height:400px;padding:15px}.bubble{max-width:95%}.composer{padding:12px}.profile .banner{margin:-18px -18px 0}.pagehead{margin-bottom:22px}.rating{gap:8px}.demo-bar{font-size:11px}.chat-head .person-line .avatar{display:none}}

<body>
<header><div class="brand"><span class="brandmark" aria-hidden="true">cv</span>CareerVillage</div><nav aria-label="Main navigation"><button data-action="nav" data-view="dashboard" id="nav-dashboard" class="quiet">Communities</button><button data-action="nav" data-view="messages" id="nav-messages" class="quiet">Messages</button><button data-action="nav" data-view="reflection" id="nav-reflection" class="quiet">My Reflection</button></nav><div class="identity"><span class="avatar" aria-hidden="true">RG</span><span>Ryland Grace<br><span class="muted tiny">Student · Demo account</span></span></div></header>
<div class="demo-bar"><span>Interactive prototype · Fictional people & scripted replies · No real messages or calls</span><button class="quiet small" data-action="reset-demo">Reset Demo</button></div>
<div class="shell"><aside class="sidebar"><p class="eyebrow">Your space</p><button data-action="nav" data-view="dashboard" class="quiet">Explore communities</button><button data-action="community" data-id="tech" class="quiet">Hispanic Students in Tech</button><button data-action="nav" data-view="messages" class="quiet">Your conversations</button><button data-action="nav" data-view="reflection" class="quiet">Your reflection</button><div class="note"><p class="eyebrow">A place to connect</p><p class="muted tiny">Ask a small question. Share an experience. Find people who can help you take your next step.</p></div></aside><main id="main" tabindex="-1"></main></div>
<dialog id="modal" aria-labelledby="modal-title"></dialog><div id="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const communities={tech:{name:'Hispanic Students in Tech',icon:'{ }',description:'A space for students exploring tech to share experiences, find encouragement, and build connections with peers and professionals.',short:'Find your people in tech. Talk internships, career fairs, and the questions you’re still figuring out.'},first:{name:'First-Generation College Students',icon:'↗',description:'Talk through the unfamiliar parts of college and careers with people who understand starting something new.',short:'Navigate the firsts together, from office hours to your first professional connection.'},cs:{name:'Computer Science Careers',icon:'⌘',description:'Explore the many ways to build a career in computing. Bring your questions and share what you’re learning.',short:'Explore different paths in computing with students and experienced professionals.'}};
const people={alex:{name:'Alex R.',initials:'AR',role:'Software Engineer',type:'Mentor',background:'First-generation college graduate',bio:'I’m an experienced software engineer and a first-generation college graduate. I remember wondering how to start conversations with professionals. I’m here to share what helped me and listen to what you’re working through.',topics:['Internship search','Career fairs','Professional networking']},maya:{name:'Maya L.',initials:'ML',role:'Computer Science student',type:'Peer',background:'First-generation college student',bio:'I’m exploring software internships and getting more comfortable asking questions. Happy to swap career fair experiences or talk through an introduction together.',topics:['Finding internships','Peer support','Campus career fairs']},diego:{name:'Diego S.',initials:'DS',role:'Student exploring tech careers',type:'Peer',background:'Early in my career exploration',bio:'I’m trying small coding projects and learning about different roles in tech. I’d love to meet other students who are figuring things out too.',topics:['Student projects','Exploring tech roles','Peer support']}};
const msg=(sender,text,extra={})=>({sender,text,...extra});
const initial={view:'dashboard',community:'tech',tab:'discussions',filter:'peers',profile:'alex',selected:'alex',joined:{},expanded:{},drafts:{},practice:'',confidence:0,reflection:{comfortable:'',nervous:'',next:''},savedReflection:null,counts:{alex:0,maya:0,diego:0},introCount:0,suggested:false,feedback:'',posts:{tech:[{id:'fair',author:'Ryland Grace',initials:'RG',role:'Student',title:'Any advice for my first career fair?',body:'I’m a first-generation CS student and this will be my first career fair. Walking up to recruiters feels intimidating. What helped you get started?',comments:[{author:'Maya L. · Student',text:'I went with a classmate and started at a table I was curious about. Having one question ready helped a lot.'},{author:'Alex R. · Mentor',text:'You don’t need a perfect pitch. Start with what you’re studying and ask about something you’re genuinely curious about.'}]},{id:'intern',author:'Maya L.',initials:'ML',role:'Student',title:'How did you find your first internship?',body:'I’m finding lots of listings, but it’s hard to know where to begin. Did a conversation or a smaller company help you get a foot in the door?',comments:[{author:'Diego S. · Student',text:'Our campus coding club shares local opportunities. I’m starting there and asking older students about their experiences.'}]}],first:[{id:'first-post',author:'Maya L.',initials:'ML',role:'Student',title:'What do you ask at office hours?',body:'I’m the first in my family to go to college. I used to think office hours were only for when you were struggling. What helped you feel comfortable going?',comments:[{author:'Alex R. · Mentor',text:'Bring one thing you tried and one question. Asking about the professor’s career path can also start a good conversation.'}]}],cs:[{id:'cs-post',author:'Diego S.',initials:'DS',role:'Student',title:'What does a software engineer’s day actually look like?',body:'I enjoy coding projects, but I’m curious how much of the job is working with other people. What surprised you?',comments:[{author:'Alex R. · Mentor',text:'A lot of my day involves clarifying questions and reviewing ideas with teammates. Communication matters just as much as writing code.'}]}]},threads:{alex:[msg('you',"Hey Alex! I'm a first-generation CS student. I have a career fair coming up, and I don't really know how to approach recruiters."),msg('alex','I remember feeling that way too. What part of it worries you the most?'),msg('you','Mostly introducing myself without sounding awkward.'),msg('alex',"A good starting point is your name, what you're studying, and the kind of work you're curious about. Keep it conversational. Want to try an example here?"),msg('you','Sure — could I send a short intro for feedback?'),msg('alex',"Of course. Send it as text, or attach a sample recording if that feels easier. I'll share what works and what I'd adjust.")],maya:[msg('maya','Hey Ryland! I saw your career fair post. I’m figuring this out too. Want to swap ideas?'),msg('you','Definitely. It helps to know I’m not the only one feeling nervous.'),msg('maya','Same here. I wrote down two questions about teams I was curious about. What kind of roles are you exploring?')],diego:[msg('diego','Hi Ryland! I’m exploring tech careers too. What are you building or learning lately?')]}};
let state=structuredClone(initial),storageAvailable=true;
// Retire the previous demo session once, so the next opening starts fresh.
try{localStorage.removeItem('cv-community-v1');const saved=JSON.parse(localStorage.getItem('cv-community-v2'));if(saved&&saved.threads&&saved.posts)state={...state,...saved};}catch(e){storageAvailable=false;}
let call=null,toastTimer;
function persist(){try{localStorage.setItem('cv-community-v2',JSON.stringify(state));}catch(e){storageAvailable=false;}}
function toast(t){$('#toast').textContent=t;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').textContent='',3500)}
function action(label,act,props='',cls=''){return `<button class="${cls}" data-action="${act}" ${props}>${label}</button>`}
function avatar(p){return `<span class="avatar" aria-hidden="true">${p.initials}</span>`}
function personLine(p){return `<div class="person-line">${avatar(p)}<div><strong>${esc(p.name)}</strong><p class="muted tiny">${esc(p.role)} · ${p.type}</p></div></div>`}
function go(view){state.view=view;persist();render();$('#main').focus();window.scrollTo(0,0)}
function render(){for(const v of ['dashboard','messages','reflection']){const active=state.view===v||(v==='dashboard'&&['community','profile'].includes(state.view));$('#nav-'+v).setAttribute('aria-current',active?'page':'false');$('#nav-'+v).setAttribute('aria-pressed',String(active));}$('#main').innerHTML=({dashboard,community,profile,messages,reflection}[state.view]||dashboard)();if(state.view==='messages'){const log=$('#transcript');log.scrollTop=log.scrollHeight}}
function dashboard(){return `<div class="pagehead"><p class="eyebrow">Connections start with a conversation</p><h1>Find Your Community</h1><p class="subtitle">You don’t have to figure out your next step alone. Meet students who get it and professionals who can share what they’ve learned.</p></div><div class="row between"><h2>Explore communities</h2><span class="muted tiny">Peers + professional mentors</span></div><div class="cards">${Object.entries(communities).map(([id,c])=>`<article class="card community-card"><div class="community-icon" aria-hidden="true">${c.icon}</div><h3>${c.name}</h3><p>${c.short}</p>${action('View Community','community',`data-id="${id}"`,id==='tech'?'primary':'')}</article>`).join('')}</div><div class="section two-col"><section><div class="row between"><h2>From the community</h2><span class="muted tiny">Recent conversations · Sample activity</span></div><div class="stack">${state.posts.tech.slice(0,2).map(p=>`<article class="panel">${personLine({name:p.author,initials:p.initials,role:p.role,type:'Community member'})}<button class="text-link post-title" data-action="preview" data-id="${esc(p.id)}">${esc(p.title)}</button><p class="muted">${esc(p.body)}</p><span class="tiny muted">Hispanic Students in Tech · ${p.comments.length} replies</span></article>`).join('')}</div></section><aside class="panel" style="align-self:start"><p class="eyebrow">Make room for connection</p><h3>A small question is a good start.</h3><p class="muted">Ask a peer about their experience, find a mentor, or simply read what others are sharing.</p><hr style="border:0;border-top:1px solid var(--line);margin:22px 0"><p class="tiny muted">This space explores access to professional connections and guidance for students from underrepresented backgrounds.</p></aside></div>`}
function community(){const c=communities[state.community];return `${action('← All communities','nav','data-view="dashboard"','quiet back')}<section class="panel"><div class="row between"><span class="tag">Community · Students & professionals</span>${action(state.joined[state.community]?'Joined ✓':'Join Community','join','',state.joined[state.community]?'':'primary')}</div><h1 style="margin-top:18px">${c.name}</h1><p class="subtitle">${c.description}</p><p class="tiny muted" style="margin-bottom:0">Students, early-career peers, and experienced mentors · Fictional demonstration community</p></section><div class="tabs" aria-label="Community sections">${action('Discussions','tab','data-tab="discussions" aria-pressed="'+(state.tab==='discussions')+'"')}${action('People','tab','data-tab="people" aria-pressed="'+(state.tab==='people')+'"')}</div>${state.tab==='discussions'?`<div class="two-col"><section><div class="row between" style="margin-bottom:16px"><h2 style="margin:0">Community conversations</h2>${action('+ Create Post','new-post','','primary small')}</div><div class="stack">${state.posts[state.community].map(postCard).join('')}</div></section><aside class="panel" style="align-self:start"><p class="eyebrow">You belong here</p><h3>Different experiences. Shared support.</h3><p class="muted tiny">Be curious, respect each other’s experiences, and share only what you’re comfortable sharing.</p>${action('Meet peers & mentors','tab','data-tab="people"','small')}</aside></div>`:peopleView()}`}
function postCard(p){const key=state.community+':'+p.id,open=state.expanded[key];return `<article class="panel">${personLine({name:p.author,initials:p.initials,role:p.role,type:'Community member'})}<h3><button class="text-link post-title" data-action="thread" data-id="${esc(p.id)}" aria-expanded="${!!open}">${esc(p.title)}</button></h3><p class="post-body">${esc(p.body)}</p><div class="row between post-footer"><span class="muted tiny">${p.comments.length} ${p.comments.length===1?'reply':'replies'} · Sample community discussion</span>${action(open?'Hide replies':'Read & reply','thread',`data-id="${esc(p.id)}" aria-expanded="${!!open}"`,'small')}</div>${open?`<div class="comments">${p.comments.map(c=>`<div class="comment"><strong class="tiny">${esc(c.author)}</strong><p>${esc(c.text)}</p></div>`).join('')}<form data-form="reply" data-id="${esc(p.id)}"><label for="reply-${esc(p.id)}">Add your perspective</label><textarea id="reply-${esc(p.id)}" data-draft="reply-${esc(key)}" required maxlength="2000" placeholder="Share an experience or ask a question…">${esc(state.drafts['reply-'+key]||'')}</textarea><button class="primary small" style="margin-top:8px">Post Reply</button></form></div>`:''}</article>`}
function peopleView(){return `<div class="row between"><h2>People in this community</h2><p class="muted tiny">Fictional demonstration profiles</p></div><div class="filters" aria-label="People filter">${action('Peers','filter',`data-filter="peers" aria-pressed="${state.filter==='peers'}"`)}${action('Mentors','filter',`data-filter="mentors" aria-pressed="${state.filter==='mentors'}"`)}</div><div class="people-grid">${Object.entries(people).filter(([id,p])=>state.filter==='mentors'?p.type==='Mentor':p.type==='Peer').map(([id,p])=>`<article class="panel">${personLine(p)}<p class="muted tiny">${p.background}</p><p>${p.bio}</p><div class="row">${action('View Profile','profile',`data-id="${id}"`)}${action('Message','message',`data-id="${id}"`,'quiet')}</div></article>`).join('')}</div>`}
function profile(){const p=people[state.profile];return `${action('← Back to Community','nav','data-view="community"','quiet back')}<article class="panel profile"><div class="banner"></div><span class="avatar large">${p.initials}</span><p class="eyebrow" style="margin-top:10px">${p.type} · Fictional profile</p><h1>${p.name}</h1><p>${p.role} · ${p.background}</p><p class="muted tiny">Member of ${communities[state.community].name}</p><div class="row">${action('Message '+p.name.split(' ')[0],'message',`data-id="${state.profile}"`,'primary')}${p.type==='Mentor'?action('Call · Demo','profile-call',`data-id="${state.profile}"`):''}</div><section><h2>About ${p.name.split(' ')[0]}</h2><p>${p.bio}</p></section><section><h2>${p.type==='Mentor'?'Happy to talk about':'Interested in'}</h2><div class="row">${p.topics.map(t=>`<span class="tag">${t}</span>`).join('')}</div></section><footer>Demo profile details are illustrative. Mentorship and availability are not guaranteed.</footer></article>`}
function messages(){const id=state.selected,p=people[id];return `<div class="pagehead"><p class="eyebrow">Keep the conversation going</p><h1>Messages</h1><p class="subtitle">A place to ask, share, and work through ideas together.</p></div><div class="inbox"><aside class="thread-list" aria-label="Conversations"><p class="eyebrow">Your conversations</p>${Object.entries(people).map(([key,v])=>`<button data-action="select-thread" data-id="${key}" aria-pressed="${id===key}">${personLine(v)}</button>`).join('')}</aside><section class="chat" aria-label="Conversation with ${p.name}"><div class="chat-head row between"><div>${personLine(p)}<p class="muted tiny" style="margin:5px 0 0">Prototype: simulated replies · No real connection</p></div><div class="row">${action('Profile','profile',`data-id="${id}"`,'small')}${p.type==='Mentor'?action('☎ Call','call','','small')+action('Video Call','video-call','','small'):''}</div></div><div id="transcript" class="transcript" role="log" aria-label="Message history" aria-live="polite">${state.threads[id].map(m=>`<div class="bubble ${m.sender==='you'?'mine':''}"><p class="bubble-name">${m.sender==='you'?'You · Ryland':p.name} · ${m.demo?'Demo activity':'Conversation'}</p><div class="bubble-body">${esc(m.text)}${m.reflection?'<br>'+action('Open Reflection','nav','data-view="reflection"','small'):''}</div></div>`).join('')}</div><form class="composer" data-form="message"><label for="message">Message ${p.name.split(' ')[0]}</label><textarea id="message" data-draft="message-${id}" required maxlength="4000" placeholder="Write what’s on your mind…">${esc(state.drafts['message-'+id]||'')}</textarea><div class="row between"><div class="row">${action('Attach','attach','','small')}${id==='alex'?action('Practice Intro · Optional','practice','','small'):''}</div><button class="primary">Send Message</button></div><p class="muted tiny" style="margin:9px 0 0">Text stays on this device. Replies are prewritten examples, not AI or real people.</p></form></section></div>`}
function reflection(){const r=state.reflection,s=state.savedReflection;return `<div class="reflection"><div class="pagehead"><p class="eyebrow">My reflection · Always optional</p><h1>Reflect on Your Networking Confidence</h1><p class="subtitle">Take a moment to notice what’s changing. Your own perspective comes first, and you can return to this whenever you like.</p></div><form data-form="reflection" class="panel"><fieldset><legend>How ready do you feel to start a conversation at a career fair?</legend><div class="rating" role="group" aria-label="Readiness from 1 to 5">${[1,2,3,4,5].map(n=>action(n,'rate',`data-value="${n}" aria-label="${n} out of 5" aria-pressed="${state.confidence===n}"`)).join('')}</div><div class="row between tiny muted"><span>1 · Not ready yet</span><span>5 · Ready to give it a try</span></div></fieldset>${[['comfortable','What do I feel more comfortable doing now?'],['nervous','What am I still nervous about?'],['next','What will I try next time?']].map(([k,label])=>`<div class="field"><label for="${k}">${label}</label><textarea id="${k}" data-reflection="${k}" required maxlength="3000">${esc(r[k])}</textarea></div>`).join('')}<div class="row"><button class="primary">Save Reflection</button>${action('Back to Alex’s Messages','message','data-id="alex"')}</div><p class="muted tiny" style="margin:12px 0 0">${s?'Saved on this device'+(JSON.stringify(s.answers)!==JSON.stringify(r)||s.confidence!==state.confidence?' · You have unsaved edits.':'.'): 'Your draft stays in this prototype. Save when you’re ready.'}</p><div id="reflection-status" role="status"></div></form>${s?`<div class="feedback"><p class="eyebrow">Compare perspectives</p><h3>Your saved self-assessment: ${s.confidence}/5</h3><p class="tiny muted" style="margin-bottom:13px">Your judgment is separate from the illustrative mentor feedback below.</p><strong>Alex’s sample feedback</strong><p>${esc(state.feedback||'You’ve identified introducing yourself as something to work on. When you’re ready, share an introduction in our conversation so we can talk through what works and what to refine.')}</p><p class="muted tiny" style="margin-top:12px">What feels consistent with your own view? What would you like to discuss with Alex?</p></div>`:''}</div>`}
function openModal(title,body){$('#modal').innerHTML=`<div class="dialog-top"><h2 id="modal-title">${title}</h2>${action('×','close','','quiet')}</div>${body}`;$('#modal').showModal()}
function closeModal(){if(call){endCall();return}$('#modal').close()}
function openPractice(){openModal('Try an introduction',`<p class="muted">Optional · Share an idea whenever you feel ready.</p><p><strong>Alex’s suggestion:</strong> Try introducing yourself as if you were speaking to a recruiter.${state.introCount?' Use your own words this time; I’ll respond to what you share.':' You could mention your name, what you’re studying, and something you’re curious about.'}</p><form data-form="practice"><label for="practice-draft">Your draft</label><textarea id="practice-draft" data-practice required maxlength="4000" style="min-height:150px" placeholder="Hi, I’m Ryland…">${esc(state.practice)}</textarea><p class="muted tiny">Sharing adds your text to Alex’s conversation and a scripted feedback reply.</p><div class="dialog-actions">${action('Keep draft & close','close')}<button class="primary">Share with Alex</button></div></form>`)}
function startCall(video=false){call={video,muted:false,camera:video};openModal(video?'Simulated Video Call':'Simulated Voice Call',`<p class="muted tiny">Demo only · No microphone, camera, or network access</p><div class="call-stage"><span class="avatar large">AR</span><h3>Alex R.</h3><p>Demo call in progress</p><p class="muted tiny">Imagine discussing your career fair questions here.<br>No live media is playing or being captured.</p><div class="row call-controls">${action('Mute · Demo','mute','aria-pressed="false"')}${video?action('Camera on · Demo','camera','aria-pressed="true"'):''}</div></div><div class="dialog-actions">${action('End Call','end-call','','danger')}</div>`);persist()}
function endCall(){call=null;$('#modal').close();state.threads.alex.push(msg('alex','Demo call ended. Back here in our chat, what would you like to talk through next? No call was placed or recorded.',{demo:true}));persist();render();toast('Simulated call ended')}
function send(text,{attachment=false,practice=false}={}){const id=state.selected;state.threads[id].push(msg('you',text,{demo:true}));state.counts[id]++;let reply;
if(id==='alex'){const intro=attachment||practice||/\b(hi|hello|hey)[,! —-]+.*\b(ryland|studying|student|computer science)\b/i.test(text)||/my (name|introduction|intro) is|here.?s my intro/i.test(text);if(intro){state.introCount++;reply=state.introCount===1?'Your introduction makes who you are and what you’re studying clear. To make it more specific, name a project or an area of software you’re curious about. Then ask a thoughtful question, like “How do interns on your team get feedback?” Try it in your own words; there’s no perfect script.':'That follow-up gives us more to talk about. Keep the part that feels natural, make your interests specific, and leave room for the recruiter to respond. You can lead the next attempt yourself; I’m here if you want another perspective.';state.feedback=reply;if(attachment)reply='Sample-clip feedback (prewritten; no media was analyzed): '+reply;}else if(/thank/i.test(text))reply='You’re welcome. You’re doing the thinking here. What’s one small conversation you’d like to try at the fair?';else if(/intern|resume|résumé/i.test(text))reply='Start with roles that connect to a project or interest you can talk about. Ask a peer where they’ve looked, then choose a few employers to learn about. What kind of software work interests you?';else if(/nervous|awkward|scared|confidence/i.test(text))reply='That feeling is understandable. You can start with one curious question rather than a polished pitch. What’s one thing about a team or its work you’d genuinely like to know?';else if(/intro|practice|feedback/i.test(text))reply='Absolutely. Share an introduction here whenever you like: your name, what you’re studying, and an interest you’d like to explore. I can offer a perspective, and you can decide what fits your voice.';else if(/fair|recruiter|question/i.test(text))reply='Try asking “What kinds of problems do interns work on with your team?” Listen to their answer and build from there. What would you want a recruiter to know about you?';else reply='I hear you. Can you give me a specific example of what you’re thinking about? We can talk through a small next step that feels useful to you.';
}else if(id==='maya')reply=/fair|nervous/i.test(text)?'I felt that too. Starting with one table made the fair feel smaller. Want to compare the questions we’re planning to ask?':'I’m glad you shared that. I’m still figuring things out too. What have you tried so far? Maybe we can swap ideas.';else reply='That sounds interesting! I’ve been learning through small projects and conversations with classmates. What part would you like to explore together?';
state.threads[id].push(msg(id,reply,{demo:true}));if(id==='alex'&&state.counts.alex>=3&&!state.suggested){state.suggested=true;state.threads.alex.push(msg('alex',"We’ve talked through a lot. This could be a good time to reflect on what feels easier now and what you still want to work on. Want to fill out a quick self-reflection? We can also keep chatting.",{demo:true,reflection:true}));}state.drafts['message-'+id]='';persist();render()}
// Event delegation keeps every view functional without a framework.
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return; e.preventDefault();const a=b.dataset.action,id=b.dataset.id;switch(a){case'reset-demo':state=structuredClone(initial);call=null;$('#modal').close();persist();render();$('#main').focus();window.scrollTo(0,0);toast('Demo reset. Ready for a fresh walkthrough.');break;case'nav':go(b.dataset.view);break;case'community':state.community=id;state.tab='discussions';go('community');break;case'join':state.joined[state.community]=!state.joined[state.community];persist();render();toast(state.joined[state.community]?'You joined this demo community':'You left this demo community');break;case'tab':state.tab=b.dataset.tab;persist();render();break;case'filter':state.filter=b.dataset.filter;persist();render();break;case'thread':state.expanded[state.community+':'+id]=!state.expanded[state.community+':'+id];persist();render();break;case'preview':state.community='tech';state.tab='discussions';state.expanded['tech:'+id]=true;go('community');break;case'profile':state.profile=id;go('profile');break;case'message':state.selected=id;go('messages');break;case'select-thread':state.selected=id;persist();render();break;case'new-post':openModal('Start a conversation',`<p class="muted tiny">Posting as Ryland · Visible only in this local prototype</p><form data-form="post"><div class="field"><label for="post-title">What’s on your mind?</label><input id="post-title" data-draft="post-title-${state.community}" required maxlength="140" value="${esc(state.drafts['post-title-'+state.community]||'')}" placeholder="Give your conversation a title"></div><label for="post-body">Share a little more</label><textarea id="post-body" data-draft="post-body-${state.community}" required maxlength="3000">${esc(state.drafts['post-body-'+state.community]||'')}</textarea><div class="dialog-actions">${action('Keep draft & close','close')}<button class="primary">Post to Community</button></div></form>`);break;case'practice':openPractice();break;case'attach':openModal('Attach a sample clip',`<p>Choose a fictional introduction to share with Alex. This adds a sample attachment label to your chat.</p><p class="muted tiny">No file is uploaded, played, recorded, or analyzed. Feedback is prewritten. Sample script: “Hi, I’m Ryland, a CS student. I’m interested in software engineering internships. What kinds of projects do interns work on?”</p>${action('♫ Sample audio intro · 0:20','clip','data-kind="audio"','clip')}${action('▣ Sample video intro · 0:25','clip','data-kind="video"','clip')}`);if(state.selected!=='alex'){$('#modal').innerHTML=`<div class="dialog-top"><h2 id="modal-title">Sample attachment</h2>${action('×','close','','quiet')}</div><p>No upload or real media is sent. Share a fictional project introduction in this peer chat.</p>${action('Share sample project clip · Demo','clip','data-kind="project"','clip')}`}break;case'clip':$('#modal').close();send(`[Simulated ${b.dataset.kind} attachment: ${b.dataset.kind==='project'?'project overview':'networking introduction'} · sample only, no playable media]`,{attachment:true});break;case'profile-call':state.selected='alex';go('messages');startCall();break;case'call':startCall();break;case'video-call':startCall(true);break;case'end-call':endCall();break;case'mute':call.muted=!call.muted;b.setAttribute('aria-pressed',call.muted);b.textContent=call.muted?'Unmute · Demo':'Mute · Demo';break;case'camera':call.camera=!call.camera;b.setAttribute('aria-pressed',call.camera);b.textContent=call.camera?'Camera on · Demo':'Camera off · Demo';break;case'close':closeModal();break;case'rate':state.confidence=Number(b.dataset.value);persist();document.querySelectorAll('.rating button').forEach(x=>x.setAttribute('aria-pressed',x.dataset.value===b.dataset.value));break;}});
document.addEventListener('input',e=>{if(e.target.dataset.draft)state.drafts[e.target.dataset.draft]=e.target.value;if(e.target.hasAttribute('data-practice'))state.practice=e.target.value;if(e.target.dataset.reflection)state.reflection[e.target.dataset.reflection]=e.target.value;persist()});
document.addEventListener('submit',e=>{const f=e.target;if(!f.dataset.form)return;e.preventDefault();switch(f.dataset.form){case'message':{const text=$('#message').value.trim();if(!text){toast('Write a message first');return}send(text);break}case'reply':{const field=f.querySelector('textarea'),text=field.value.trim();if(!text){toast('Write a reply first');return}state.posts[state.community].find(p=>p.id===f.dataset.id).comments.push({author:'Ryland Grace · Student (you)',text});state.drafts[field.dataset.draft]='';persist();render();toast('Your reply was added locally');break}case'post':{const title=$('#post-title').value.trim(),body=$('#post-body').value.trim();if(!title||!body){toast('Add a title and a message');return}state.posts[state.community].unshift({id:'p'+Date.now(),author:'Ryland Grace',initials:'RG',role:'Student',title,body,comments:[]});state.drafts['post-title-'+state.community]='';state.drafts['post-body-'+state.community]='';$('#modal').close();persist();render();toast('Your post was added to the community');break}case'practice':{const text=$('#practice-draft').value.trim();if(!text){toast('Write an introduction first');return}state.practice='';state.selected='alex';state.view='messages';$('#modal').close();send(text,{practice:true});break}case'reflection':if(!state.confidence){toast('Choose your readiness from 1 to 5');return}if(Object.values(state.reflection).some(v=>!v.trim())){toast('Add a few words to each reflection prompt');return}state.savedReflection={confidence:state.confidence,answers:{...state.reflection}};persist();render();$('#reflection-status').textContent=storageAvailable?'Reflection saved on this device. You can keep editing.':'Reflection saved for this session. Browser storage is unavailable.';toast('Reflection saved');break}});
$('#modal').addEventListener('cancel',e=>{if(call){e.preventDefault();endCall()}});
render();
</script>
</body>
</html>
